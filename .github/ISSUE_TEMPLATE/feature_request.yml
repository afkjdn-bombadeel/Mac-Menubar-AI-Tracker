name: Feature request
description: Suggest a small local-first improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow would this improve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should the app do?
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety fit
      options:
        - label: This can stay local-only.
        - label: This does not require reading secrets.
        - label: This does not require background services or automatic installs.
